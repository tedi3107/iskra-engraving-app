# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "12e1a234e8febd1c03b7f262dbb9920e"
name = "Jewelry-Engraving-test-app"
application_url = "https://mature-pdf-biz-grand.trycloudflare.com/app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory privacy (GDPR) webhooks — required for apps distributed
  # through the App Store, harmless otherwise.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_files,write_cart_transforms,read_files"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://mature-pdf-biz-grand.trycloudflare.com/api/auth" ]

[app_proxy]
url = "https://mature-pdf-biz-grand.trycloudflare.com/apps/engraving"
subpath = "engraving"
prefix = "apps"
