on: [push, pull_request]

name: CI

jobs:
  CI:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0

      # Shopify CLI's own "function typegen" command internally shells out
      # to pnpm regardless of which package manager the project itself
      # uses, so pnpm needs to be present even though everything else
      # here runs through npm.
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 8

      - name: Install dependencies
        run: npm install

      - name: Generate Shopify Function types
        run: npm run typegen --prefix extensions/engraving-cart-transform

      - name: Run TypeScript type checking
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'javascript') }}
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Unit tests (app + storefront core)
        run: npm test

      - name: Cart transform unit tests
        run: npx vitest run --root extensions/engraving-cart-transform tests/cart_transform_run.test.ts

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Storefront browser tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
