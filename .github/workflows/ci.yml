strategy:
  matrix:
    node: [22.12.0, 24]
    manager: ['npm', 'yarn', 'pnpm']
steps:
  ...
  - name: Install pnpm
    if: ${{ matrix.manager == 'pnpm' }}    # ← SAMO za pnpm granu!
    uses: pnpm/action-setup@...

  - name: Install dependencies using ${{ matrix.manager }}
    run: ${{ matrix.manager }} install

  - name: Generate Shopify Function types
    run: npm run typegen --prefix extensions/engraving-cart-transform
